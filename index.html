<!DOCTYPE 
<html>
  <head>
    <meta charset="utf-8" />
    <title>AR 數位名片</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>

    <style>
      /* 霧玻璃 UI 容器與按鈕樣式設定 */
      #ui-container {
        position: absolute;
        bottom: 20px;
        left: 0;
        width: 100%;
        display: flex;
        justify-content: center;
        z-index: 10;
        pointer-events: none;
      }
      .btn {
        padding: 10px 15px;
        font-size: 14px;
        font-weight: bold;
        border-radius: 12px;
        margin: 0 5px;
        cursor: pointer;
        pointer-events: auto;
        text-align: center;
        transition: all 0.3s ease;
        color: #333;
        
        /* 霧玻璃特效 */
        background: rgba(255, 255, 255, 0.4);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }
      .btn:active {
        background: rgba(255, 255, 255, 0.6);
        transform: scale(0.95);
      }
    </style>

    <script>
      // 顯示平面名片與光影函式
      window.showImage = function(fileName, target) {
        const plane = document.querySelector('#display-plane');
        const model = document.querySelector('#display-model');
        const shadow = document.querySelector('#glow-shadow');
        
        // 隱藏 3D 模型
        if(model) model.setAttribute('visible', false);
        
        // 顯示平面與光影並更新圖片路徑
        if(plane) {
          if(fileName) plane.setAttribute('src', 'assets/' + fileName);
          plane.setAttribute('visible', true);
          if(shadow) shadow.setAttribute('visible', true);
          
          // 觸發進場與漂浮動畫
          plane.emit('playScale');
          setTimeout(() => {
            plane.emit('playFloat');
            if(shadow) shadow.emit('playFloat'); 
          }, 100); 
        }
      };

      // 顯示 3D 模型函式
      window.show3D = function(fileName, target) {
        const plane = document.querySelector('#display-plane');
        const model = document.querySelector('#display-model');
        const shadow = document.querySelector('#glow-shadow');
        
        // 隱藏平面圖片與專屬光影
        if(plane) plane.setAttribute('visible', false);
        if(shadow) shadow.setAttribute('visible', false);
        
        // 顯示 3D 模型並設定比例為 0.3
        if(model) {
          if(fileName) model.setAttribute('gltf-model', 'assets/' + fileName);
          model.setAttribute('visible', true);
          model.setAttribute('scale', '0.3 0.3 0.3'); 
        }
      };

      // 註冊 Marker 掃描事件監聽器
      AFRAME.registerComponent('marker-handler', {
        init: function () {
          this.el.addEventListener('markerFound', () => {
            // 預設載入 assets/my-card.jpg
            window.showImage('my-card.jpg'); 
          });
        }
      });
    </script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    
    <div id="ui-container">
      <div class="btn" onclick="showImage('my-card.jpg', '_blank')">🖼️ 平面名片</div>
      <div class="btn" onclick="window.open('https://youtu.be/s9_33EVIjTE?si=YCNQ-JKQBZ8v78p9', '_blank')">🎥 影片介紹</div>
      <div class="btn" onclick="window.open('https://tim6404.github.io/design-works/', '_blank')">🌐 個人網頁</div>
      <div class="btn" onclick="show3D('robot.glb', '_blank')">🤖 3D 動態</div>
    </div>

    <a-scene 
      embedded 
      arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;"
      renderer="logarithmicDepthBuffer: true; colorManagement: true;"
      vr-mode-ui="enabled: false">
      
      <a-assets>
        <img id="card-img" src="assets/my-card.jpg">
        <a-asset-item id="robot-model" src="assets/robot.glb"></a-asset-item>
      </a-assets>

      <a-marker marker-handler type="pattern" url="assets/pattern-qr.ioi.tw.patt" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
        
        <a-plane id="display-plane" 
                 src="#card-img" 
                 position="0 0.1 0" 
                 rotation="-90 0 0" 
                 width="1.5" 
                 height="1"
                 visible="false"
                 animation__scale="property: scale; from: 0 0 0; to: 1 1 1; dur: 1000; easing: easeOutElastic; startEvents: playScale"
                 animation__float="property: position; from: 0 0.1 0; to: 0 0.3 0; dir: alternate; dur: 1000; loop: true; startEvents: playFloat">
        </a-plane>

        <a-plane id="glow-shadow"
                 width="1.5" height="1"
                 rotation="-90 0 0" 
                 position="0 0.01 0" 
                 material="color: #0088ff; transparent: true; opacity: 0.8; shader: flat;"
                 visible="false"
                 animation__scale="property: scale; from: 1 1 1; to: 0.6 0.6 0.6; dir: alternate; dur: 1000; loop: true; startEvents: playFloat"
                 animation__opacity="property: opacity; from: 0.8; to: 0.2; dir: alternate; dur: 1000; loop: true; startEvents: playFloat">
        </a-plane>

        <a-entity id="display-model" 
                  gltf-model="#robot-model" 
                  scale="0.3 0.3 0.3" 
                  position="0 0 0"
                  visible="false"
                  animation-mixer>
        </a-entity>

      </a-marker>

      <a-light type="ambient" color="#ffffff" intensity="1.5"></a-light>
      <a-entity camera></a-entity>
      
    </a-scene>
  </body>

</html>
